[project]
name = "edr-wd"
version = "0.1.0"
description = "MCP server for Windows EDR GUI automation via pywinauto"
requires-python = ">=3.9"
dependencies = [
    "fastmcp>=3.1.0",
    "pywinauto>=0.6.8",
    "psutil>=5.9.0",
    "Pillow>=10.0.0",
    "paramiko>=3.4.0",
    "PyAutoGUI>=0.9.54",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.21"]

[tool.pytest.ini_options]
# Add `target/` and `agent/` to sys.path so test files can use
# `import action_dispatcher`, `from execution import ...`, etc.
# (P2.1 review issue #6 — tests should not mutate sys.path).
pythonpath = ["target", "agent", "."]
testpaths = ["test_case"]
asyncio_mode = "auto"
addopts = "-m 'unit and not regression'"
markers = [
    "unit: deterministic unit, contract, fake-target, and offline regression tests",
    "regression: exhaustive offline evaluation, report, and historical regression matrices",
    "integration: tests that require a configured live MCP target",
    "e2e: end-to-end Windows/macOS HiSec tests that mutate or inspect a live GUI",
]

[project.scripts]
edr-wd = "edr_wd.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
