name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS is the primary development platform: the offline unit suite is
  # verified green there on python 3.10, and the POSIX packaging build +
  # smoke run natively. The repo's default pytest addopts already deselect
  # live-target markers (unit and not regression), so no configured target
  # machine is needed.
  test-and-package-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Offline unit suite
        run: python -m pytest

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build mcp bundle (POSIX)
        run: packaging/pyinstaller/build.sh --clean

      - name: Smoke test mcp bundle
        run: packaging/pyinstaller/smoke.sh

  # Windows is the live-target platform: build and smoke the mcp.exe bundle
  # there, and keep the packaging contract regressions green on the same
  # platform that ships it.
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Packaging contract regressions
        run: python -m pytest test_case/test_recording/test_packaging_contract.py

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build mcp.exe bundle
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging/pyinstaller/build.ps1 -Clean

      - name: Smoke test mcp.exe bundle
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging/pyinstaller/smoke.ps1
